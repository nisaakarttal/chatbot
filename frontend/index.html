<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>E-Ticaret Akıllı Destek</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <header>
        <h1>Mağaza Adı</h1>
    </header>

    <div id="chat-container">
        <div id="chat-header">
            <span>Akıllı Asistan</span>
        </div>

        <div id="chat-messages">
            <div class="message bot">
                Merhaba! Size nasıl yardımcı olabilirim?
            </div>
        </div>

        <div id="chat-options">
            <button onclick="sendQuickMessage('ürün öner')">🎁 Ürün Öner</button>
            <button onclick="sendQuickMessage('sipariş')">📦 Sipariş Takibi</button>
            <button onclick="sendQuickMessage('iade')">🔄 İade İşlemi</button>
        </div>

        <div id="chat-input-area">
            <input
                id="chat-input"
                type="text"
                placeholder="Mesajınızı yazın..."
            />
            <button onclick="sendMessage()">Gönder</button>
        </div>
    </div>

    <script src="/js/app.js"></script>
</body>
</html>
